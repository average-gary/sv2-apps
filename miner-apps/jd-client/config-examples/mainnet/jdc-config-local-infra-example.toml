# SRI JDC config
listening_address = "0.0.0.0:34265"

# Version support
max_supported_version = 2
min_supported_version = 2

# Auth keys for open encrypted connection downstream
authority_public_key = "9auqWEzQDVyd2oe1JVGFLMLHZtCo2FFqZwtKA5gd9xbuEu7PH72"
authority_secret_key = "mkDLTBBRxdBv998612qipDYoTK3YUrqLe8uWw7gu3iXbSrn2n"
cert_validity_sec = 3600

# How many shares we expect to receive in a minute (determines difficulty targets)
shares_per_minute = 6.0

# How many shares do we want to acknowledge in a batch
share_batch_size = 10

# Number of rollable extranonce bytes reserved for extended downstreams (default 8)
# reserved_downstream_rollable_extranonce_size = 8

# JDC supports two modes:
# "FULLTEMPLATE"  - full template mining
# "COINBASEONLY" - coinbase-only mining
mode = "FULLTEMPLATE"

# string to be added into the Coinbase scriptSig
jdc_signature = "Sv2MinerSignature"

# Solo Mining config
# Coinbase output used to build the coinbase tx in case of Solo Mining (as last-resort solution of the pools fallback system)
#
# Coinbase outputs are specified as descriptors. A full list of descriptors is available at
#     https://github.com/bitcoin/bips/blob/master/bip-0380.mediawiki#appendix-b-index-of-script-expressions
# Although the `musig` descriptor is not yet supported and the legacy `combo` descriptor never
# will be. If you have an address, embed it in a descriptor like `addr(<address here>)`.
coinbase_reward_script = "addr(bc1q9f9vj7spn8h7qda6pn8d4g4j99f0mn9lhwz55j)"

# Enable this option to set a predefined log file path.
# When enabled, logs will always be written to this file.
# The CLI option --log-file (or -f) will override this setting if provided.
# log_file = "./jd-client.log"

# Protocol Extensions Configuration
# Extensions that the JDC supports (will accept if requested by downstream clients)
# Comment/uncomment to enable/disable specific extensions:
supported_extensions = [
    0x0002,  # Worker-Specific Hashrate Tracking
]

# Monitoring HTTP server address for exposing channel data (optional)
monitoring_address = "0.0.0.0:9091"
monitoring_cache_refresh_secs = 15

# List of upstreams (Pool and JDS) used as backup endpoints
# In case of shares refused by the Pool or JDS, the fallback system will propose the same job to the next upstream in this list
[[upstreams]]
authority_pubkey = "9auqWEzQDVyd2oe1JVGFLMLHZtCo2FFqZwtKA5gd9xbuEu7PH72"
# pool_address and jds_address accept IP addresses or hostnames (e.g. "pool.example.com")
pool_address = "127.0.0.1"
pool_port = 3333
jds_address = "127.0.0.1"
jds_port = 3334
user_identity = "your_primary_username_here"
# ----- Optional iroh-transport fields (Phase 4b — JDC outbound dials) -----
# Requires running JDC with `--features iroh-transport`.
#
# iroh_pool_node_id: base32-lowercase NodeId of the upstream pool's iroh
#   listener (`sv2/pool/0`). Required to enable iroh dialing for this pool.
# iroh_jds_node_id: same shape, for the JDS listener (`sv2/jds/0`).
# iroh_relay_url: shared relay hint for both pool and JDS dials of this
#   upstream. Empty/omitted = direct UDP only.
# prefer_transport: one of "tcp" | "iroh" | "iroh_then_tcp" (default) |
#   "tcp_then_iroh". When iroh fields are set but prefer_transport is "tcp",
#   the iroh fields are ignored.
#
# iroh_pool_node_id  = "k51qzi5uqu5dl..."
# iroh_jds_node_id   = "k51qzi5uqu5dl..."
# iroh_relay_url     = ""
# prefer_transport   = "iroh_then_tcp"

[[upstreams]]
authority_pubkey = "9auqWEzQDVyd2oe1JVGFLMLHZtCo2FFqZwtKA5gd9xbuEu7PH72"
pool_address = "75.119.150.111"
pool_port = 3333
jds_address = "75.119.150.111"
jds_port = 3334
user_identity = "your_backup_username_here"
# iroh_pool_node_id  = "k51qzi5uqu5dl..."
# iroh_jds_node_id   = "k51qzi5uqu5dl..."
# iroh_relay_url     = ""
# prefer_transport   = "iroh_then_tcp"

# Local Sv2 Template Provider config
[template_provider_type.Sv2Tp]
# address accepts "ip:port" or "hostname:port" (e.g. "tp.example.com:8442")
address = "127.0.0.1:8442"

# ----- Optional iroh-transport for the JDC→TP dial (Phase 4b) -----
# Same semantics as the per-upstream iroh fields above. Only honored when
# `template_provider_type` is `Sv2Tp` (BitcoinCoreIpc uses a UNIX socket).
#
# [template_provider_iroh]
# iroh_node_id     = "k51qzi5uqu5dl..."
# iroh_relay_url   = ""
# prefer_transport = "iroh_then_tcp"

# ----------------------------------------------------------------------------
# [iroh] — JDC's downstream listener over the iroh transport
# ----------------------------------------------------------------------------
#
# Proxies / mining-clients connect to JDC here. When this block is present and
# the `iroh-transport` Cargo feature is enabled, JDC binds an iroh QUIC
# endpoint alongside the TCP `listening_address` above, accepting Sv2
# connections from either transport (a "Dual" listener fans both into one
# accept channel).
#
# When this block is absent, JDC speaks TCP only — preserving the legacy
# behavior with zero changes for existing deployments.
#
# Run with: cargo run --bin jd_client --features iroh-transport -- -c <this file>
#
# All keys other than the two required ones below have sensible defaults; see
# stratum_apps::network_helpers::iroh::IrohRoleConfig for the full schema.
#
# [iroh]
# # UDP socket the iroh endpoint binds. Use [::]:34266 for IPv6 dual-stack.
# listen_address = "0.0.0.0:34266"
# # 32-byte raw Ed25519 secret key file (mode 0600). Auto-generated if missing.
# # NodeId lifecycle is independent of the SV2 authority key above.
# secret_key_path = "~/.config/sv2/jdc/iroh-secret.ed25519"
#
# # Optional: relay URL for hole-punching when peers are double-NATed.
# # Empty = direct UDP only; set to a self-hosted relay for production.
# # relay_url = ""
#
# # QUIC keepalive (Fedimint PR #8422 — production lesson).
# # max_idle_timeout_secs    = 60
# # keep_alive_interval_secs = 30
# # per_request_timeout_secs = 30   # Fedimint PR #8571 — slowloris defense.
#
# # Per-mechanism discovery toggles (env vars override these).
# # discovery_relay_enable      = true
# # discovery_pkarr_pub_enable  = true
# # discovery_pkarr_res_enable  = true
# # discovery_dht_enable        = false
# # discovery_n0_enable         = true
#
# # Operator-supplied dial overrides for known NodeIds.
# # [iroh.connection_overrides]
# # "k51qzi5uqu5dl..." = "192.0.2.5:34266"
#
# # QUIC-layer admission policy. "open" admits any NodeId; "whitelist" admits
# # only the listed NodeIds, rejecting unknown peers BEFORE any SV2 bytes flow
# # (two-layer identity model — see plan §"Two-layer identity model").
# # Mutable at runtime via the AdmissionHandle returned by IrohSv2Listener.
# # [iroh.admission]
# # mode = "open"
# # allowed_node_ids = [
# #   # "k51qzi5uqu5dl...",
# # ]
