# Local Mining Device Downstream Connection
downstream_address = "0.0.0.0"
downstream_port = 34255

# Version support
max_supported_version = 2
min_supported_version = 2

# Extranonce2 size for downstream connections
# This controls the rollable part of the extranonce for downstream SV1 miners
# Max value for CGminer: 8
# Min value: 2
downstream_extranonce2_size = 4

# If true, tProxy verifies upstream coinbase outputs against the payout encoded by each upstream
# `user_identity`.
# Keep false for standard pool mining, including pools that use a Bitcoin address as the username.
# Enable for solo/donation identities: sri/solo/<address>/<worker>,
# sri/donate/<percentage>/<address>/<worker>, or legacy <address>[.worker].
verify_payout = false

# Aggregate channels: if true, all miners share one upstream channel; if false, each miner gets its own channel
aggregate_channels = true

# Enable this option to set a predefined log file path.
# When enabled, logs will always be written to this file.
# The CLI option --log-file (or -f) will override this setting if provided.
# log_file = "./tproxy.log"

# Protocol extensions configuration
# Extensions that the translator supports (will request if required by server)
# Example: supported_extensions = [0x0002, 0x0003]
supported_extensions = [
    0x0002,  # Worker-Specific Hashrate Tracking
]

# Monitoring HTTP server address for exposing channel data (optional)
monitoring_address = "0.0.0.0:9092"
monitoring_cache_refresh_secs = 15

# Difficulty params
[downstream_difficulty_config]
# hashes/s of the weakest miner that will be connecting (e.g.: 10 Th/s = 10_000_000_000_000.0)
min_individual_miner_hashrate=10_000_000_000_000.0
# target number of shares per minute the miner should be sending
shares_per_minute = 6.0
# enable variable difficulty adjustment (true by default, set to false when using with JDC)
enable_vardiff = true

# Interval in seconds for sending keepalive jobs to downstream miners.
job_keepalive_interval_secs = 60

[[upstreams]]
# SRI Pool Primary Pool
# address accepts IP addresses or hostnames (e.g. "pool.example.com")
address = "75.119.150.111"
port = 3333
authority_pubkey = "9auqWEzQDVyd2oe1JVGFLMLHZtCo2FFqZwtKA5gd9xbuEu7PH72"
user_identity = "your_primary_username_here"

# Optional iroh transport per-peer fields. Only honored when the translator
# is built with the `iroh-transport` feature AND the top-level `[iroh]`
# block below is present. When the feature is off, these fields are ignored.
#
# iroh_node_id    — base32-lowercase NodeId of the upstream (peer must publish
#                   it via discovery, or it must be supplied via
#                   `[iroh.connection_overrides]` below).
# iroh_relay_url  — optional relay URL hint for this peer; empty string ⇒ none.
# prefer_transport — one of: "tcp", "iroh", "iroh_then_tcp" (default),
#                   "tcp_then_iroh".
# iroh_node_id    = "k51qzi5uqu5dl..."
# iroh_relay_url  = ""
# prefer_transport = "iroh_then_tcp"

# Braiins Pool Backup Pool
[[upstreams]]
address = "107.170.42.64"
port = 3333
authority_pubkey = "9awtMD5KQgvRUh2yFbjVeT7b6hjipWcAsQHd6wEhgtDT9soosna"
user_identity = "your_backup_username_here"

# Optional iroh transport — see the §"Per-role `[iroh]` section (TOML)" of
# the playbook for the full schema. Required when any `[[upstreams]]` entry
# above sets `iroh_node_id`. Drop this block (or leave it commented out) for
# pure TCP behavior.
#
# [iroh]
# listen_address     = "0.0.0.0:0"
# secret_key_path    = "~/.config/sv2/translator/iroh-secret.ed25519"
# # relay_url        = ""
# # max_idle_timeout_secs    = 60
# # keep_alive_interval_secs = 30
# # per_request_timeout_secs = 30
# #
# # Per-mechanism discovery toggles. All default to the values shown.
# # discovery_relay_enable      = true
# # discovery_pkarr_pub_enable  = true
# # discovery_pkarr_res_enable  = true
# # discovery_dht_enable        = false
# # discovery_n0_enable         = true
# #
# # Connection-overrides escape hatch for known operator-supplied dials.
# # [iroh.connection_overrides]
# # "k51qzi5uqu5dl..." = "192.0.2.5:34256"
# #
# # The translator is a *client* role and never accepts SV2 connections, so
# # the [iroh.admission] section is unused here. Leaving the default ("open")
# # has no effect on outbound dials.
