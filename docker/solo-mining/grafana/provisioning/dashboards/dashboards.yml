# =============================================================================
# Grafana Dashboard Provisioning
# =============================================================================

apiVersion: 1

providers:
  - name: 'SV2 Solo Mining'
    orgId: 1
    folder: 'SV2 Solo Mining'
    folderUid: 'sv2-solo'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
