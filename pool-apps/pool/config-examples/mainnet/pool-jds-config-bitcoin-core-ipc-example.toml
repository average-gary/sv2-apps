# SRI Pool config (with embedded Job Declaration Server)
authority_public_key = "9auqWEzQDVyd2oe1JVGFLMLHZtCo2FFqZwtKA5gd9xbuEu7PH72"
authority_secret_key = "mkDLTBBRxdBv998612qipDYoTK3YUrqLe8uWw7gu3iXbSrn2n"
cert_validity_sec = 3600
listen_address = "0.0.0.0:3333"

# Coinbase outputs are specified as descriptors. A full list of descriptors is available at
#     https://github.com/bitcoin/bips/blob/master/bip-0380.mediawiki#appendix-b-index-of-script-expressions
# Although the `musig` descriptor is not yet supported and the legacy `combo` descriptor never
# will be. If you have an address, embed it in a descriptor like `addr(<address here>)`.
coinbase_reward_script = "addr(bc1qtzqxqaxyy6lda2fhdtp5dp0v56vlf6g0tljy2x)"

# Server Id (number to guarantee unique search space allocation across different Pool servers)
server_id = 1

# Pool signature (string to be included in coinbase tx)
pool_signature = "Stratum V2 SRI Pool"

# Enable this option to set a predefined log file path.
# When enabled, logs will always be written to this file.
# The CLI option --log-file (or -f) will override this setting if provided.
# log_file = "./pool.log"

# How many shares we expect to receive in a minute (determines difficulty targets)
shares_per_minute = 6.0
# How many shares do we want to acknowledge in a batch
share_batch_size = 10

# Protocol Extensions Configuration
# Extensions that the pool supports (will accept if requested by clients)
# Comment/uncomment to enable/disable specific extensions:
supported_extensions = [
    # 0x0002,  # Worker-Specific Hashrate Tracking
]

# Extensions that the pool requires (clients must support these to connect)
# Use with caution - requiring extensions may prevent some clients from connecting
required_extensions = [
    # Example: require Worker-Specific Hashrate Tracking
    # 0x0002,
]

# Monitoring HTTP server address for exposing channel data (optional)
monitoring_address = "127.0.0.1:9090"
monitoring_cache_refresh_secs = 15

# Bitcoin Core IPC config
# Supported networks: mainnet, testnet4, signet, regtest
# Default data_dir: ~/.bitcoin (Linux) or ~/Library/Application Support/Bitcoin (macOS)
[template_provider_type.BitcoinCoreIpc]
version = 31
network = "mainnet"
# data_dir = "/custom/bitcoin/data"  # Optional: override default data directory
fee_threshold = 100
min_interval = 5

# Embedded Job Declaration Server (JDS)
# Pool runs a JDS subserver that listens for JDP connections from JDC.
# Requires template_provider_type = BitcoinCoreIpc (JDS backend is selected by Pool startup).
# Shared fields (authority keys, cert_validity, coinbase_reward_script) are inherited
# from the Pool config above.
[jds]
listen_address = "0.0.0.0:3334"

# (optional) iroh-transport configuration for the JDS *listener*.
#
# This section is only honored when `pool_sv2` is built with
# `--features iroh-transport`. When present, JDS listens for JDC connections
# over TCP (above) AND iroh QUIC simultaneously. Each transport's accept
# stream feeds the same downstream-handling pipeline; downstream code cannot
# tell which transport produced a given connection.
#
# JDS registers exactly the `sv2/jds/0` ALPN at the QUIC layer — JDC dials it
# with the matching ALPN. Mismatched ALPNs are rejected at the QUIC handshake
# before any SV2 bytes flow.
#
# See plan §"Per-role `[iroh]` section (TOML)" and the Phase 3b PR for the
# full schema. The Ed25519 NodeId secret is auto-generated (mode 0600) on
# first start if `secret_key_path` does not exist.
#
# [jds.iroh]
# listen_address  = "0.0.0.0:34257"
# secret_key_path = "~/.config/sv2/jds/iroh-secret.ed25519"
#
# # Optional (defaults shown):
# # discovery_relay_enable      = true
# # discovery_pkarr_pub_enable  = true
# # discovery_pkarr_res_enable  = true
# # discovery_dht_enable        = false
# # discovery_n0_enable         = true
# # relay_url                   = ""
# # max_idle_timeout_secs       = 60
# # keep_alive_interval_secs    = 30
# # per_request_timeout_secs    = 30
#
# # [jds.iroh.connection_overrides]
# # "k51qzi5uqu5dl..." = "192.0.2.5:34257"
#
# # [jds.iroh.admission]
# # mode = "open"            # one of: "open", "whitelist"
# # allowed_node_ids = []    # initial whitelist; mutate at runtime via the AdmissionHandle
